name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename (e.g., gold)'
        required: true
        default: 'gold'
      branch:
        description: 'OrangeFox branch (fox-14.1 or fox-12.1)'
        required: true
        default: 'fox-14.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build OrangeFox

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip msmtp ca-certificates openjdk-17-jdk wget python3 python3-pip
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH
        echo "PATH=$PATH" >> $GITHUB_ENV

    - name: Sync OrangeFox Sources
      run: |
        cd ${{ github.workspace }}
        mkdir -p OrangeFox_sync
        cd OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 14.1 --path ${{ github.workspace }}/fox_14.1
      env:
        GIT_LFS_SKIP_SMUDGE: 1

    - name: Create Device Tree
      run: |
        cd ${{ github.workspace }}/fox_14.1
        
        # Create directories
        mkdir -p device/xiaomi/gold/prebuilt
        mkdir -p device/xiaomi/gold/recovery/root/system/etc
        
        # AndroidProducts.mk
        cat << 'EOF' > device/xiaomi/gold/AndroidProducts.mk
        PRODUCT_MAKEFILES := \
            \$(LOCAL_DIR)/twrp_gold.mk
        
        COMMON_LUNCH_CHOICES := \
            twrp_gold-ap2a-eng
        EOF
        
        # twrp_gold.mk
        cat << 'EOF' > device/xiaomi/gold/twrp_gold.mk
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/core_64_bit.mk)
        \$(call inherit-product, bootable/recovery/orangefox.mk)
        
        PRODUCT_DEVICE := gold
        PRODUCT_NAME := twrp_gold
        PRODUCT_BRAND := Xiaomi
        PRODUCT_MODEL := Poco X6 Neo
        PRODUCT_MANUFACTURER := Xiaomi
        
        PRODUCT_BROKEN_VERIFY_USES_LIBRARIES := true
        PRODUCT_BROKEN_MISSING_REQUIRED_MODULES := true
        WITHOUT_CHECK_API := true
        EOF
        
        # BoardConfig.mk (with GKI/LKM support)
        cat << 'EOF' > device/xiaomi/gold/BoardConfig.mk
        DEVICE_PATH := device/xiaomi/gold
        
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_CPU_VARIANT := generic
        TARGET_CPU_VARIANT_RUNTIME := cortex-a76
        
        TARGET_2ND_ARCH := arm
        TARGET_2ND_ARCH_VARIANT := armv8-2a
        TARGET_2ND_CPU_ABI := armeabi-v7a
        TARGET_2ND_CPU_ABI2 := armeabi
        TARGET_2ND_CPU_VARIANT := generic
        TARGET_2ND_CPU_VARIANT_RUNTIME := cortex-a55
        
        TARGET_BOOTLOADER_BOARD_NAME := mt6833
        TARGET_BOARD_PLATFORM := mt6833
        TARGET_NO_BOOTLOADER := true
        TARGET_USES_UEFI := true
        TARGET_OTA_ASSERT_DEVICE := gold
        
        PRODUCT_FULL_TREBLE_OVERRIDE := true
        BOARD_VNDK_VERSION := current
        
        ALLOW_MISSING_DEPENDENCIES := true
        BUILD_BROKEN_DUP_RULES := true
        BUILD_BROKEN_ELF_PREBUILT_PRODUCT_COPY_FILES := true
        BUILD_BROKEN_MISSING_REQUIRED_MODULES := true
        BUILD_BROKEN_PREBUILT_ELF_FILES := true
        BUILD_BROKEN_VINTF_PRODUCT_COPY_FILES := true
        DISABLE_ARTIFACT_PATH_REQUIREMENTS := true
        
        TW_INCLUDE_CRYPTO := true
        TW_INCLUDE_CRYPTO_FBE := true
        BOARD_USES_METADATA_PARTITION := true
        TW_INCLUDE_FBE_METADATA_DECRYPT := true
        TW_USE_FSCRYPT_POLICY := 2
        TW_CRYPTO_USE_SYSTEM_VOLD := true
        
        PLATFORM_VERSION := 16
        PLATFORM_VERSION_LAST_STABLE := 15
        PLATFORM_SECURITY_PATCH := 2099-12-31
        BOOT_SECURITY_PATCH := \$(PLATFORM_SECURITY_PATCH)
        VENDOR_SECURITY_PATCH := \$(PLATFORM_SECURITY_PATCH)
        
        TARGET_KERNEL_ARCH := arm64
        TARGET_KERNEL_HEADER_ARCH := arm64
        TARGET_NO_KERNEL := true
        BOARD_RAMDISK_USE_LZ4 := true
        BOARD_KERNEL_SEPARATED_DTBO := true
        TARGET_PREBUILT_DTB := \$(DEVICE_PATH)/prebuilt/dtb
        BOARD_USES_GENERIC_KERNEL_IMAGE := true
        BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE := true
        BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT := true
        BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true
        
        TW_LOAD_VENDOR_BOOT_MODULES := true
        TW_LOAD_VENDOR_MODULES := "touchscreen mtk_disp focaltech_touch goodix_touch"
        
        BOARD_VENDOR_CMDLINE := bootopt=64S3,32N2,64N2
        BOARD_KERNEL_BASE := 0x40078000
        BOARD_PAGE_SIZE := 4096
        BOARD_KERNEL_OFFSET := 0x00008000
        BOARD_RAMDISK_OFFSET := 0x11088000
        BOARD_TAGS_OFFSET := 0x07c08000
        BOARD_BOOT_HEADER_VERSION := 4
        BOARD_HEADER_SIZE := 2128
        BOARD_DTB_OFFSET := 0x07c08000
        
        BOARD_MKBOOTIMG_ARGS += --dtb \$(TARGET_PREBUILT_DTB)
        BOARD_MKBOOTIMG_ARGS += --vendor_cmdline \$(BOARD_VENDOR_CMDLINE)
        BOARD_MKBOOTIMG_ARGS += --pagesize \$(BOARD_PAGE_SIZE) --board ""
        BOARD_MKBOOTIMG_ARGS += --kernel_offset \$(BOARD_KERNEL_OFFSET)
        BOARD_MKBOOTIMG_ARGS += --ramdisk_offset \$(BOARD_RAMDISK_OFFSET)
        BOARD_MKBOOTIMG_ARGS += --tags_offset \$(BOARD_TAGS_OFFSET)
        BOARD_MKBOOTIMG_ARGS += --header_version \$(BOARD_BOOT_HEADER_VERSION)
        BOARD_MKBOOTIMG_ARGS += --dtb_offset \$(BOARD_DTB_OFFSET)
        
        BOARD_FLASH_BLOCK_SIZE := 262144
        BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864
        BOARD_SUPER_PARTITION_SIZE := 9126805504
        BOARD_SUPER_PARTITION_GROUPS := main
        BOARD_MAIN_SIZE := 9122611200
        BOARD_MAIN_PARTITION_LIST := system product vendor odm
        
        TARGET_COPY_OUT_ODM := odm
        TARGET_COPY_OUT_PRODUCT := product
        TARGET_COPY_OUT_SYSTEM := system
        TARGET_COPY_OUT_VENDOR := vendor
        
        BOARD_PRODUCTIMAGE_FILE_SYSTEM_TYPE := ext4
        BOARD_SYSTEMIMAGE_FILE_SYSTEM_TYPE := ext4
        BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4
        BOARD_ODMIMAGE_FILE_SYSTEM_TYPE := ext4
        BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := f2fs
        TARGET_USERIMAGES_USE_EXT4 := true
        TARGET_USERIMAGES_USE_F2FS := true
        BOARD_PROPERTY_OVERRIDES_SPLIT_ENABLED := true
        BOARD_USES_MTK_HARDWARE := true
        
        TARGET_SYSTEM_PROP += \$(DEVICE_PATH)/system.prop
        TARGET_RECOVERY_FSTAB := \$(DEVICE_PATH)/recovery/root/system/etc/recovery.fstab
        
        TARGET_NO_RECOVERY := true
        BOARD_HAS_LARGE_FILESYSTEM := true
        BOARD_HAS_NO_SELECT_BUTTON := true
        BOARD_SUPPRESS_SECURE_ERASE := true
        TARGET_RECOVERY_PIXEL_FORMAT := RGBX_8888
        BOARD_AVB_ENABLE := true
        
        TW_MAX_BRIGHTNESS := 2047
        TW_FRAMERATE := 60
        TW_STATUS_ICONS_ALIGN := center
        TW_THEME := portrait_hdpi
        TW_NO_SCREEN_BLANK := true
        TWRP_NEW_THEME := true
        RECOVERY_SDCARD_ON_DATA := true
        TW_EXCLUDE_DEFAULT_USB_INIT := true
        TW_PREPARE_DATA_MEDIA_EARLY := true
        TW_USE_NEW_MINADBD := true
        TW_EXCLUDE_APEX := true
        TW_EXTRA_LANGUAGES := true
        TW_DEFAULT_LANGUAGE := en
        TW_HAS_NO_DISPLAY_CUTOUT := false
        TW_NO_LEGACY_PROPS := true
        TW_NO_BIND_SYSTEM := true
        TW_BACKUP_EXCLUSIONS := /data/fonts
        TW_INPUT_BLACKLIST := "hbtp_vm"
        TARGET_USE_CUSTOM_LUN_FILE_PATH := /config/usb_gadget/g1/functions/mass_storage.usb0/lun.%d/file
        TW_USE_SERIALNO_PROPERTY_FOR_DEVICE_ID := true
        TW_NO_FLASH_CURRENT_TWRP := true
        TW_USE_DMCTL := true
        TW_NO_HAPTICS := true
        TW_INCLUDE_FASTBOOTD := true
        TARGET_USES_LOGD := true
        TWRP_INCLUDE_LOGCAT := true
        TW_INCLUDE_RESETPROP := true
        TW_INCLUDE_REPACKTOOLS := true
        TW_INCLUDE_LIBRESETPROP := true
        TW_INCLUDE_LPDUMP := true
        TW_INCLUDE_LPTOOLS := true
        TW_INCLUDE_NTFS_3G := true
        TARGET_USES_MKE2FS := true
        TW_INCLUDE_FUSE_NTFS := true
        TW_INCLUDE_FUSE_EXFAT := true
        TW_ENABLE_FS_COMPRESSION := false
        
        FOX_RECOVERY_SYSTEM_IS_BYOD := 1
        FOX_VANILLA_BUILD := 0
        FOX_BUGGED_AOSP_DHCP := 1
        OF_QUICK_BACKUP_LIST := "/boot;/init_boot;/vendor_boot;"
        
        BOARD_VENDOR_RAMDISK_FRAGMENTS := init_boot
        BOARD_VENDOR_RAMDISK_FRAGMENT.init_boot.PREBUILT := \$(DEVICE_PATH)/ramdisk.init_boot.lz4
        BOARD_VENDOR_RAMDISK_FRAGMENT.init_boot.MKBOOTIMG_ARGS := --ramdisk_type platform
        
        TW_DEVICE_VERSION := gold-HOS3-HOS4-GKI
        EOF
        
        # Fix CTS error
        mkdir -p cts/tests/tests/os/assets
        echo "15" >> cts/tests/tests/os/assets/platform_releases.txt
        echo "16" >> cts/tests/tests/os/assets/platform_releases.txt

    - name: Build OrangeFox
      run: |
        cd ${{ github.workspace }}/fox_14.1
        source build/envsetup.sh
        lunch twrp_gold-ap2a-eng
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE=Stable
        mka recoveryimage -j4 2>&1 | tee build.log

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: OrangeFox-Recovery
        path: |
          fox_14.1/out/target/product/gold/*.img
          fox_14.1/out/target/product/gold/OrangeFox*.img
        retention-days: 9

    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log
        path: fox_14.1/build.log
        retention-days: 9
